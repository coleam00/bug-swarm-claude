<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <title>Bug Swarm arena</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <style>
      /* Safe areas, as index.html: src/web/arena/main.ts reads them through .safe-probe to keep
         the minimap and the readout out of a notch. */
      :root { --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); }
      .safe-probe { position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); }
      html, body { margin: 0; height: 100%; background: #05070d; color: #f8fafc; overflow: hidden; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #arena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      /* Shown while the socket is down: the arena rejoins on its own. */
      #status { position: fixed; left: 50%; top: max(16px, var(--safe-top)); transform: translateX(-50%);
        padding: 8px 16px; border-radius: 8px; background: rgba(5, 7, 13, 0.85); border: 1px solid rgba(34, 211, 238, 0.4);
        font: bold 16px system-ui, sans-serif; pointer-events: none; }
      #status[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="arena"></canvas>
    <div id="status" hidden>Connecting...</div>
    <script type="module" src="/src/web/arena/main.ts"></script>
  </body>
</html>
