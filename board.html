<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070d" />
    <title>Bug Swarm board</title>
    <style>
      /* The stream board. Sizes are in vh so they scale with the stream frame: at 1280x720 a row is
         8vh (58 px) and a team total 9.5vh (68 px). Team colours come from TEAM_LOOK, set from code.
         The arena strip runs along the bottom, across both columns. */
      html, body { margin: 0; height: 100%; }
      body { background-color: #05070d; color: #f8fafc; font-family: system-ui, "Segoe UI", sans-serif; overflow: hidden;
        background-image: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.7) 100%),
          repeating-linear-gradient(0deg, rgba(34, 211, 238, 0.06) 0 1px, transparent 1px 6vh),
          repeating-linear-gradient(90deg, rgba(34, 211, 238, 0.06) 0 1px, transparent 1px 6vh); }
      p, h1, ol, ul { margin: 0; }
      #board { box-sizing: border-box; height: 100vh; display: grid; grid-template-columns: 58fr 42fr;
        grid-template-rows: minmax(0, 1fr) auto; gap: 2vh 4vh; padding: 3vh 4vh; }

      .top { list-style: none; padding: 0; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
      .row { display: flex; align-items: baseline; gap: 2.2vh; font-size: 8vh; line-height: 1.05; font-weight: 700;
        padding: 0 1.4vh; border-radius: 1vh; }
      .rank { flex: 0 0 1.4em; text-align: right; color: #94a3b8; font-variant-numeric: tabular-nums; }
      /* A name too wide shrinks to fit from code (view.ts fitName), to 5vh at least; only then the ellipsis. */
      /* Rows are line-height 1.05 so the arena strip fits (#74); the name's clip box reaches 0.1em past
         its line, padding cancelled by margin, so descenders (g, j, p, q, y) are not cut off. */
      .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        padding-block: 0.1em; margin-block: -0.1em; }
      .score { flex: 0 0 auto; color: #22d3ee; font-variant-numeric: tabular-nums; text-shadow: 0 0 1.2vh rgba(34, 211, 238, 0.6); }
      .row.empty .name { color: #334155; }

      .race { display: flex; flex-direction: column; justify-content: center; gap: 1.6vh; min-width: 0; text-align: center; }
      .title { font-size: 6.5vh; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
        text-shadow: 0 0 2vh rgba(34, 211, 238, 0.7); }
      .live { display: flex; justify-content: center; align-items: baseline; gap: 1.5vh; }
      .live-count { font-size: 7vh; font-weight: 800; line-height: 1.1; color: #22d3ee; font-variant-numeric: tabular-nums;
        text-shadow: 0 0 1.5vh rgba(34, 211, 238, 0.6); }
      .live-label { font-size: 3.5vh; color: #94a3b8; }
      .race-title { font-size: 4vh; color: #94a3b8; }
      .teams { display: flex; flex-direction: column; gap: 1.5vh; }
      .team { min-width: 0; display: flex; flex-direction: column; padding: 0.5vh 2vh; border-radius: 1.5vh;
        border: 0.4vh solid transparent; }
      .team.ahead { border-color: var(--team); }
      .team-label { font-size: 5vh; line-height: 1.1; font-weight: 700; color: var(--team); }
      .team-total { min-width: 0; font-size: 9.5vh; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--team);
        text-shadow: 0 0 2.5vh var(--team); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar { display: flex; height: 3.5vh; border-radius: 1.75vh; overflow: hidden; background: #1e293b; }
      .bar-seg { flex-basis: 0; min-width: 0; transition: flex-grow 0.8s ease; }
      .join { display: flex; flex-direction: column; font-size: 4.5vh; font-weight: 700; line-height: 1.2; }
      .join-label { font-size: 3.5vh; color: #94a3b8; font-weight: 400; }
      .join-part { white-space: nowrap; }

      /* One line of arena pills; view.ts fitPills shows as many as fit, then '+N more'. */
      .arenas { grid-column: 1 / -1; list-style: none; padding: 0; display: flex; gap: 1.5vh; flex-wrap: nowrap;
        overflow: hidden; justify-content: safe center; }
      .pill { flex: 0 0 auto; white-space: nowrap; font-size: 3.5vh; font-weight: 700; line-height: 1.2; padding: 0.6vh 1.8vh;
        border: 0.3vh solid #22d3ee; border-radius: 3vh; color: #e2e8f0; font-variant-numeric: tabular-nums; }
      .pill.more, .pill.empty-note { color: #94a3b8; border-color: #334155; }

      /* In the top padding band, above both columns: the arena strip holds the bottom edge (#74). */
      .status { position: fixed; right: 2vh; top: 0.3vh; font-size: 2.6vh; line-height: 1; color: #94a3b8; }

      /* A new top-10 entry, or the team that just took the lead: a 1.5 s glow, then it settles. */
      .row.flash { animation: row-flash 1.5s ease-out; }
      .team.flash { animation: team-flash 1.5s ease-out; }
      @keyframes row-flash {
        from { background: rgba(34, 211, 238, 0.35); text-shadow: 0 0 2vh #22d3ee; }
        to { background: transparent; text-shadow: none; }
      }
      @keyframes team-flash {
        from { background: color-mix(in srgb, var(--team) 35%, transparent); transform: scale(1.06); }
        to { background: transparent; transform: none; }
      }

      /* Portrait or narrow: one column, the race first, sized by width, scrolling allowed. */
      @media (max-aspect-ratio: 1/1) {
        body { overflow: auto; }
        #board { height: auto; min-height: 100vh; display: flex; flex-direction: column-reverse; justify-content: flex-end;
          gap: 4vw; padding: 4vw; }
        .race { gap: 3vw; }
        .title { font-size: 9vw; }
        .race-title { font-size: 5vw; }
        .teams { gap: 2vw; }
        .team { padding: 1vw 3vw; border-radius: 2vw; border-width: 0.6vw; }
        .team-label { font-size: 6vw; }
        .team-total { font-size: 13vw; }
        .bar { height: 3vw; border-radius: 1.5vw; }
        .join { font-size: 5.5vw; }
        .join-label { font-size: 4.5vw; }
        .live { gap: 2vw; }
        .live-count { font-size: 11vw; }
        .live-label { font-size: 5vw; }
        .race { order: 1; } /* column-reverse: the race on top, then the arena pills, then the top 10 */
        .arenas { flex-wrap: wrap; gap: 2vw; }
        .pill { font-size: 4.5vw; padding: 1vw 2.5vw; border-width: 0.5vw; border-radius: 4vw; }
        .row { font-size: 7vw; gap: 2.5vw; padding: 0 1.5vw; border-radius: 1.5vw; }
        .status { font-size: 3.5vw; line-height: normal; right: 3vw; top: auto; bottom: 2vw; }
      }
    </style>
  </head>
  <body>
    <main id="board"></main>
    <script type="module" src="/src/web/board/main.ts"></script>
  </body>
</html>
