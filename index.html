<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <title>Bug Swarm</title>
    <style>
      html, body { margin: 0; background: #05070d; color: #f8fafc; overscroll-behavior: none; }
      /* Game over. Portrait: one column. A phone held sideways: summary and top 10 side by side. */
      .over { min-height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; padding: 12px 16px; font-family: system-ui, sans-serif; text-align: center; user-select: none; }
      .over p, .over h1, .over h2, .over ol { margin: 0; }
      .over-summary { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 24px; }
      .over h1 { font-size: 40px; }
      .over-score { font-size: 56px; font-weight: 800; }
      .over-alert { color: #fda4af; font-size: 22px; }
      .over-hint { font-size: 22px; }
      .over-board { width: min(100%, 420px); font-size: 22px; }
      .over h2 { font-size: 26px; margin-bottom: 8px; }
      .over ol { padding-left: 36px; line-height: 1.5; text-align: left; }
      .over li > span { display: inline-block; width: calc(100% - 3em); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
      .over li > b { display: inline-block; width: 3em; text-align: right; }
      @media (orientation: landscape) and (max-height: 520px) {
        .over { flex-direction: row; gap: 24px; padding: 8px 24px; }
        .over-summary { flex: 1 1 0; gap: 6px; font-size: 20px; }
        .over h1 { font-size: 30px; }
        .over-score { font-size: 44px; }
        .over-alert, .over-hint { font-size: 18px; }
        .over-board { flex: 1 1 0; max-width: 420px; font-size: 18px; }
        .over h2 { font-size: 20px; margin-bottom: 4px; }
        .over ol { line-height: 1.3; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
