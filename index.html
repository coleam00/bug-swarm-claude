<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <title>Bug Swarm</title>
    <meta name="description" content="Aim, dodge and revive your team in a shared arena. Race Tabs vs Spaces for the stream's top 10." />
    <!-- Icons and the link preview are drawn in code and served by the app (src/server/art.ts). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The server makes the preview image URLs absolute from the request (src/server/share.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bug Swarm" />
    <meta property="og:description" content="Aim, dodge and revive your team in a shared arena. Race Tabs vs Spaces for the stream's top 10." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A glowing robot in a dark grid arena, surrounded by bugs, under the words BUG SWARM" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bug Swarm" />
    <meta name="twitter:description" content="Aim, dodge and revive your team in a shared arena. Race Tabs vs Spaces for the stream's top 10." />
    <meta name="twitter:image" content="/og.png" />
    <style>
      /* Safe areas (a notch or a home bar, a phone held sideways): the overlays pad by these and
         src/web/arena/game.ts reads them through .safe-probe to pull the canvas HUD, the minimap
         and the dash button in. One source, so a probe can override them to simulate a notch
         (headless Chrome reports zero). */
      :root { --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); }
      .safe-probe { position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); }
      html, body { margin: 0; background: #05070d; color: #f8fafc; overscroll-behavior: none; }
      /* No stray phone gestures on game UI: no text selection or long-press menu, no double-tap zoom
         (the life-over screen plays again on a tap anywhere). The canvas keeps its own touch-action: none. */
      html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      /* The name is typed and can be edited, so its input stays selectable. */
      .setup input { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
      /* The start screen: the drawn backdrop (backdrop/), the live arena over it once it shows (#79:
         dimmed and blurred, fading in), a dark middle so the title reads, then the title, the tagline,
         "N playing now" and either "Play as <name>" or the name field and Play (the server picks the team, #131).
         No rules or instructions: a name problem shows one short line under the field. */
      .setup { position: relative; z-index: 1; min-height: 100dvh; box-sizing: border-box; overflow: hidden; display: flex;
        flex-direction: column; align-items: center; justify-content: center; gap: 20px; font-family: system-ui, sans-serif; text-align: center;
        padding: max(16px, var(--safe-top)) max(16px, var(--safe-right)) max(16px, var(--safe-bottom)) max(16px, var(--safe-left)); }
      .setup::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(5, 7, 13, 0.72), rgba(5, 7, 13, 0) 70%); }
      .start-backdrop { position: fixed; inset: 0; z-index: -3; width: 100%; height: 100%; display: block; pointer-events: none; }
      .start-live { position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%; display: block; pointer-events: none;
        opacity: 0; filter: blur(2px) brightness(0.6); transition: opacity 400ms ease; }
      .start-live.on { opacity: 1; }
      @media (prefers-reduced-motion: reduce) { .start-live { transition: none; } }
      .start-title { margin: 0; font: 900 clamp(52px, 15vw, 128px)/0.95 system-ui, sans-serif; letter-spacing: 0.02em; color: #ffffff;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.55), 0 0 28px rgba(34, 211, 238, 0.67), 0 0 60px rgba(34, 211, 238, 0.33); }
      .start-tag { margin: 0; font-size: clamp(20px, 5vw, 26px); font-weight: 600; color: #cbd5e1; }
      /* "N playing now" (people only): one line whose space is kept while empty. */
      .start-playing { margin: -8px 0 0; min-height: 1.3em; font-size: 18px; line-height: 1.3; font-weight: 600; color: #67e8f9;
        font-variant-numeric: tabular-nums; }
      .start-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(100%, 380px); margin-top: 8px; }
      .setup input { box-sizing: border-box; width: 100%; min-height: 56px; font: inherit; font-size: 24px; padding: 8px 14px; border-radius: 10px;
        border: 2px solid #334155; background: rgba(15, 23, 42, 0.9); color: #f8fafc; text-align: center; }
      .setup input::placeholder { color: #64748b; }
      .setup button { font: inherit; font-weight: 800; border-radius: 10px; cursor: pointer; color: #05070d; border: 0; }
      .setup button:focus-visible, .setup input:focus-visible { outline: 3px solid #f8fafc; outline-offset: 2px; }
      .setup .start-play { width: 100%; min-height: 68px; padding: 8px 16px; font-size: 26px; line-height: 1.15; overflow-wrap: anywhere; }
      .setup .start-change { min-height: 44px; padding: 4px 16px; background: none; color: #cbd5e1; font-size: 18px; font-weight: 500;
        text-decoration: underline; text-underline-offset: 3px; }
      .start-alert { margin: 0; color: #fda4af; font-size: 20px; font-weight: 600; }
      /* The team reveal (#131), over the arena after Play: a dim veil, the team word flicking in its
         colour (--team), then landing with a burst (a radial gradient that grows and fades) and
         "You're on Spaces!". Never takes input. Reduced motion: no burst, and it lands at once (App). */
      .reveal { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 8px; pointer-events: none; overflow: hidden; background: rgba(5, 7, 13, 0.72); font-family: system-ui, sans-serif; text-align: center;
        padding: max(16px, var(--safe-top)) max(16px, var(--safe-right)) max(16px, var(--safe-bottom)) max(16px, var(--safe-left)); }
      .reveal-word { position: relative; margin: 0; font: 900 clamp(48px, 17vw, 140px)/1 system-ui, sans-serif; letter-spacing: 0.04em;
        color: var(--team); text-shadow: 0 0 24px var(--team); }
      .reveal-line { position: relative; margin: 0; min-height: 1.3em; font-size: clamp(22px, 6vw, 36px); line-height: 1.3; font-weight: 800; color: #f8fafc; }
      .reveal.landed .reveal-word { animation: reveal-pop 300ms ease-out; }
      .reveal-burst { position: absolute; left: 50%; top: 50%; width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax; border-radius: 50%;
        background: radial-gradient(circle, var(--team) 0, transparent 40%); animation: reveal-burst 500ms ease-out forwards; }
      @keyframes reveal-pop { from { transform: scale(1.35); } to { transform: scale(1); } }
      @keyframes reveal-burst { from { transform: scale(0.05); opacity: 0.9; } to { transform: scale(1); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .reveal-burst { display: none; } .reveal.landed .reveal-word { animation: none; } }
      /* The arena's canvas, full screen. It takes every touch itself (the twin sticks). */
      .arena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      /* "Connecting..." / "Reconnecting...", or the server's limits (#104): shown only while the socket is down; the
         arena rejoins on its own. The longer limit messages wrap on a narrow phone instead of running off it. */
      .status { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); margin: 0; padding: 8px 16px; border-radius: 8px;
        background: rgba(5, 7, 13, 0.85); border: 1px solid rgba(34, 211, 238, 0.4); font: bold 16px system-ui, sans-serif;
        pointer-events: none; width: max-content; max-width: calc(100% - 32px); box-sizing: border-box; text-align: center; }
      /* The first-life hint (hint.ts): fades in, holds, fades out over HINT_MS (5 s), at the bottom.
         Touches pass through it, so the sticks under it still work. */
      .hint { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 16px); transform: translateX(-50%); pointer-events: none;
        margin: 0; padding: 10px 18px; border-radius: 12px; background: rgba(15, 23, 42, 0.8); color: #f8fafc;
        font: 600 clamp(16px, 4.4vw, 20px)/1.3 system-ui, sans-serif; text-align: center; width: max-content;
        max-width: calc(100% - 32px); box-sizing: border-box; opacity: 0; animation: hint 5000ms ease-in-out both; }
      @keyframes hint { 0% { opacity: 0; } 8% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }
      /* The life-over screen, over the arena that keeps playing behind it, dimmed. A tap or click
         anywhere plays again (App.tsx), so it is one big target. Portrait: one column, the summary
         and Play again, then the top 10. A short landscape screen (a phone held sideways): two
         columns, summary and Play again left, top 10 right, nothing to scroll. */
      .over { position: fixed; inset: 0; z-index: 2; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; background: rgba(5, 7, 13, 0.6); font-family: system-ui, sans-serif;
        text-align: center; cursor: pointer; touch-action: manipulation; animation: over-in 200ms ease-out both;
        padding: max(12px, var(--safe-top)) max(16px, var(--safe-right)) max(12px, var(--safe-bottom)) max(16px, var(--safe-left)); }
      @keyframes over-in { from { opacity: 0; } }
      .over p, .over h1, .over h2, .over ol { margin: 0; }
      .over-summary { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .over h1 { font-size: 30px; line-height: 1.1; }
      .over-score { font-size: 56px; font-weight: 800; line-height: 1.05; color: #fde047; font-variant-numeric: tabular-nums; }
      .over-line { font-size: 22px; font-weight: 600; }
      .over-rank { font-size: 18px; font-weight: 600; color: #cbd5e1; }
      .over-alert { color: #fda4af; }
      /* Play again: big, hidden (its space kept) until 800 ms after the life ended (RESTART_DELAY_MS, guard.ts). */
      .over-again { margin-top: 6px; min-height: 60px; min-width: 220px; padding: 10px 32px; font: inherit; font-size: 26px; font-weight: 800;
        border: 0; border-radius: 12px; background: #22d3ee; color: #05070d; cursor: pointer; }
      .over-again:focus-visible { outline: 3px solid #f8fafc; outline-offset: 2px; }
      /* Tabs vs Spaces: one line of totals over a thin bar split by them. */
      .over-race { width: min(100%, 360px); display: flex; flex-direction: column; gap: 4px; }
      .over .over-race p { display: flex; justify-content: space-between; gap: 12px; font-size: 16px; line-height: 1.2; }
      .over-race-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #1e293b; }
      .over-race-bar span { flex-basis: 0; min-width: 0; }
      .over-board { width: min(100%, 380px); font-size: 18px; }
      .over h2 { font-size: 20px; margin-bottom: 4px; }
      .over ol { padding-left: 36px; line-height: 1.25; text-align: left; }
      /* Name and score stay inline blocks: display:flex on the li would drop the list numbers. */
      .over ol > li > span { display: inline-block; width: calc(100% - 4.2em); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
      .over ol > li > b { display: inline-block; width: 4.2em; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .over ol > li.mine { background: rgba(34, 211, 238, 0.18); color: #22d3ee; border-radius: 6px; }
      @media (orientation: landscape) and (max-height: 520px) {
        .over { flex-direction: row; gap: 32px;
          padding: max(8px, var(--safe-top)) max(24px, var(--safe-right)) max(8px, var(--safe-bottom)) max(24px, var(--safe-left)); }
        .over-summary { flex: 1 1 0; max-width: 380px; gap: 4px; }
        .over h1 { font-size: 24px; }
        .over-score { font-size: 44px; }
        .over-line { font-size: 18px; }
        .over-rank { font-size: 15px; }
        .over .over-race p { font-size: 14px; }
        .over-race-bar { height: 6px; }
        .over-again { min-height: 52px; font-size: 22px; padding: 8px 28px; }
        .over-board { flex: 1 1 0; font-size: 16px; }
        .over h2 { font-size: 18px; margin-bottom: 2px; }
        .over ol { line-height: 1.2; }
        .setup { gap: 8px;
          padding: max(8px, var(--safe-top)) max(16px, var(--safe-right)) max(8px, var(--safe-bottom)) max(16px, var(--safe-left)); }
        .start-title { font-size: clamp(40px, 15vh, 88px); }
        .start-tag { font-size: 18px; }
        .start-playing { margin: -4px 0 0; font-size: 15px; }
        .start-actions { gap: 8px; margin-top: 4px; width: min(100%, 440px); }
        .setup input { min-height: 48px; font-size: 20px; padding: 4px 12px; }
        .setup .start-play { min-height: 56px; font-size: 22px; }
        .start-alert { font-size: 17px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
